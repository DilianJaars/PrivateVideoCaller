<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Meeting | PrivateClass</title><link rel="stylesheet" href="css/style.css"></head>
<body class="meeting-page"><header class="meeting-header"><div class="logo">PrivateClass</div><button onclick="leaveMeeting()" class="leave-btn">Leave Meeting</button></header>
<main class="meeting-container"><div id="meetingNotice" class="meeting-notice"></div><div class="video-grid"><div class="video-card"><video id="localVideo" autoplay muted playsinline></video><div class="video-name">You</div></div><div class="video-card"><div class="waiting" id="remoteStatus">Waiting for participant...</div><video id="remoteVideo" autoplay playsinline></video><div class="video-name">Participant</div></div></div>
<div class="meeting-controls"><button onclick="toggleMic()" class="control-btn">🎤</button><button onclick="toggleCamera()" class="control-btn">📹</button><button onclick="shareScreen()" class="control-btn">🖥️</button><button onclick="leaveMeeting()" class="end-call">End Call</button></div></main><script src="js/app.js"></script></body></html>
