<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Sign Up | PrivateClass</title><link rel="stylesheet" href="css/style.css"></head>
<body class="auth-page"><div class="auth-container"><div class="auth-box"><a href="index.html" class="back">← Back</a><h1>Create account</h1><p class="auth-description">Create your PrivateClass account.</p>
<form id="signupForm"><label>Full Name</label><input id="signupName" required placeholder="Enter your full name"><label>Email</label><input type="email" id="signupEmail" required placeholder="Enter your email"><label>Password</label><input type="password" id="signupPassword" required minlength="6" placeholder="Create a password"><label>Account Type</label><select id="accountType" required><option value="">Choose account type</option><option value="teacher">Teacher</option><option value="student">Student</option></select><button class="btn black-btn full-btn">Create Account</button></form>
<p id="signupMessage" class="message"></p><p class="switch-page">Already have an account? <a href="login.html">Login</a></p></div></div><script src="js/app.js"></script></body></html>
